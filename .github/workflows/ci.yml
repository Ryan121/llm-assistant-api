name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release job derives the semver bump from these prefixes, so a
      # malformed subject silently means "no release".
      - name: Validate commit subjects
        run: |
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,}'
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject="$(git log -1 --format=%s "$sha")"
            case "$subject" in
              "Merge "*) continue ;;
            esac
            if printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "ok   $subject"
            else
              echo "BAD  $subject"
              failed=1
            fi
          done < <(git rev-list "$base".."$head")
          if [ "$failed" -eq 1 ]; then
            echo
            echo "Commit subjects must follow Conventional Commits, e.g.:"
            echo "  feat(api): add /v1/completions passthrough"
            echo "  fix(proxy): return 504 on upstream read timeout"
            echo "  feat(api)!: drop the legacy /chat route   <- major bump"
            exit 1
          fi

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy --strict
        run: mypy

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: pytest
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=90 --junitxml=junit.xml
      - name: Summarise coverage
        if: always()
        run: |
          {
            echo "### Coverage (py${{ matrix.python-version }})"
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  docker:
    name: Build the gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: llm-assistant-api:ci
          build-args: |
            APP_VERSION=0.0.0-ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image must serve /healthz with no vLLM behind it -- that is what
      # lets Compose start the gateway while the model is still loading.
      - name: Smoke-test the image
        run: |
          docker run -d --name gw -p 8080:8080 \
            -e UPSTREAM_BASE_URL=http://127.0.0.1:9/v1 \
            -e API_KEYS=ci-key \
            llm-assistant-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo '--- /healthz'
          curl -fsS http://127.0.0.1:8080/healthz
          echo '--- /version'
          curl -fsS -H 'Authorization: Bearer ci-key' http://127.0.0.1:8080/version
          echo '--- /readyz (must be 503: no model server in CI)'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)
          test "$code" = "503" || { echo "expected 503, got $code"; docker logs gw; exit 1; }
          echo '--- unauthenticated /v1/models (must be 401)'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/models)
          test "$code" = "401" || { echo "expected 401, got $code"; docker logs gw; exit 1; }
          docker rm -f gw

  infra:
    name: Validate Terraform and Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible
        run: pip install 'ansible-core>=2.16' ansible-lint
      - name: Syntax-check the playbooks
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook site.yml --syntax-check
          ansible-playbook deploy.yml --syntax-check
      # The playbooks pass the stricter `production` profile today; `basic` is
      # the gate so a new rule in a future ansible-lint cannot break CI.
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint --profile=basic site.yml deploy.yml

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the config with the example environment
        run: |
          cp .env.example .env
          docker network create llm-assistant-net
          docker volume create llm-assistant-model-cache
          docker compose config >/dev/null
          docker compose --profile autocomplete config >/dev/null
          echo 'compose config renders for both profiles'

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint the deployment scripts
        run: shellcheck -x -S warning scripts/*.sh .githooks/*
