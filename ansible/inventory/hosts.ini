# Default: the GPU box IS this machine.
[gpu_hosts]
localhost ansible_connection=local

# To drive a remote 2x A6000 box instead, comment out the line above and use:
#
# [gpu_hosts]
# gpu-01 ansible_host=10.0.0.21 ansible_user=ubuntu
#
# then point Terraform at the same host:
#   DOCKER_HOST=ssh://ubuntu@10.0.0.21 make quickstart

[gpu_hosts:vars]
ansible_python_interpreter=auto_silent
