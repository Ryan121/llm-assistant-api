[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
display_skipped_hosts = False
forks                = 10

# Readable multi-line task results without depending on a collection: the
# `yaml` STDOUT CALLBACK lives in community.general and is absent from a bare
# ansible-core install, but the built-in `default` callback can format its
# results as YAML on its own.
stdout_callback         = default
callback_result_format  = yaml
callback_format_pretty  = True

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
